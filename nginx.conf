# =====================================================================
# NMS Web Next - nginx 配置
# =====================================================================
# - 静态资源托管：/usr/share/nginx/html
# - History/Hash 路由兜底：尝试加载文件，失败回退 index.html
# - API 反向代理：
#     /api/*        → 后端 nmsappsrv（HTTP）
#     /ws           → WebSocket
#     /webssh       → WebSocket（xterm.js）
#     /acs-file-server/* → 文件服务（HTTP）
# - gzip 压缩
# - 安全头（XSS/Frame/CSP 等）
# =====================================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # 字符集
    charset utf-8;

    # 静态资源根目录
    root   /usr/share/nginx/html;
    index  index.html;

    # ============ gzip 压缩 ============
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ============ 安全响应头 ============
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ============ 静态资源缓存策略 ============
    # hash 资源长期缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 不缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # ============ API 反向代理 ============
    # 后端服务地址通过环境变量注入（默认 nmsappsrv:8080）
    # 部署时在 docker-compose 或 k8s 中通过 env 注入 BACKEND_HOST
    location /api/ {
        proxy_pass http://${BACKEND_HOST:-nmsappsrv}:${BACKEND_PORT:-8080};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传文件大小限制（500MB，可按需调整）
        client_max_body_size 500m;
        # 长请求超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ============ WebSocket 反向代理 ============
    location /ws {
        proxy_pass http://${BACKEND_HOST:-nmsappsrv}:${BACKEND_PORT:-8080};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket 长连接超时
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ============ WebSSH（xterm.js + WebSocket）============
    location /webssh {
        proxy_pass http://${BACKEND_HOST:-nmsappsrv}:${BACKEND_PORT:-8080};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # WebSSH 长连接超时
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ============ 文件服务反向代理 ============
    location /acs-file-server/ {
        proxy_pass http://${BACKEND_HOST:-nmsappsrv}:${BACKEND_PORT:-8080};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 文件上传大小限制
        client_max_body_size 2g;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # ============ SPA 路由兜底 ============
    # 使用 hash 路由，因此所有非文件请求都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============ 健康检查端点 ============
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ============ 错误页面 ============
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
